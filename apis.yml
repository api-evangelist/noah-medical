name: Noah Medical
description: 'Noah Medical is a surgical robotics company building the Galaxy System,
  a robotic-assisted bronchoscopy platform for interventional pulmonology. The system
  combines advanced imaging, precision targeting, single-use scope technology, and
  an adaptive workflow to deliver "tool-in-lesion" confidence for diagnosing lung
  nodules, improving diagnostic yield and workflow efficiency for physicians. Noah
  Medical is a medical-device manufacturer focused on clinical hardware and does not
  currently expose a public developer platform, API, or documentation surface; it
  was added to the API Evangelist network as a healthcare portfolio company backed
  by Hongshan (HongShan Capital / formerly Sequoia China).'
